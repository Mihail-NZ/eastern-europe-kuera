name: CEE Side 285 Souvenir Photo Collection
on:
  push:
    branches:
      - cee-photo-collection-temp-20261121
    paths:
      - .github/workflows/cee-photo-collect.yml
  workflow_dispatch:
jobs:
  collect-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout only photo collector files
        uses: actions/checkout@v4
        with:
          sparse-checkout: photo-collection
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image downloader libraries
        run: python -m pip install requests beautifulsoup4 Pillow
      - name: Collect photos into per-country folders
        run: python photo-collection/collect.py
      - name: Archive images and manifest
        run: |
          cd photo-collection
          zip -qr ../CEE_Side_285_souvenir_actual_photos.zip collected
      - name: Upload actual photo folders and manifest as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CEE_Side_285_souvenir_actual_photos
          path: CEE_Side_285_souvenir_actual_photos.zip
          if-no-files-found: error
          retention-days: 7
